name: Build PBRP for starlte

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      RELEASE_TAG:
        description: 'Release tag (e.g. v1.0-starlte)'
        required: true
        default: 'v1.0-starlte'

env:
  DEVICE: starlte
  VENDOR: samsung
  MANIFEST_URL: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
  MANIFEST_BRANCH: android-10.0
  DEVICE_TREE_URL: https://github.com/AnCry1596/android_device_starlte-pbrp
  DEVICE_TREE_BRANCH: android-10.0

jobs:
  build:
    name: Build PBRP Recovery
    runs-on: ubuntu-latest
    steps:
      - name: Clean runner disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses6 lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libwxgtk3.2-dev libxml2 libxml2-utils lzop \
            pngcrush python3 python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config --global user.email "ci@github.actions"
          git config --global user.name "GitHub Actions"
          git config --global credential.helper ""
          git config --global url."https://github.com/".insteadOf "git://github.com/"

      - name: Initialize repo
        run: |
          mkdir -p ~/android/pbrp
          cd ~/android/pbrp
          repo init \
            -u ${{ env.MANIFEST_URL }} \
            -b ${{ env.MANIFEST_BRANCH }} \
            --depth=1

      - name: Sync repo
        run: |
          cd ~/android/pbrp
          repo sync \
            --no-repo-verify \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j$(nproc)

      - name: Clone device tree
        run: |
          cd ~/android/pbrp
          # Remove any conflicting device trees pulled in by repo sync
          rm -rf device/samsung/m20lte
          git clone \
            --depth=1 \
            -b ${{ env.DEVICE_TREE_BRANCH }} \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} \
            device/${{ env.VENDOR }}/${{ env.DEVICE }}

      - name: Fix roomservice.py Python 2 syntax
        run: |
          cd ~/android/pbrp
          # Fix old-style except syntax and invalid escape sequence for Python 3
          sed -i "s/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/" vendor/pb/build/tools/roomservice.py
          sed -i "s/'\\\d'/r'\\\d'/" vendor/pb/build/tools/roomservice.py

      - name: Build PBRP recovery
        run: |
          cd ~/android/pbrp
          source build/envsetup.sh
          lunch omni_${{ env.DEVICE }}-eng
          mka pbrp -j$(nproc)

      - name: Upload recovery image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: starlte-recovery
          path: ~/android/pbrp/out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: error

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.RELEASE_TAG }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "PBRP starlte ${{ steps.tag.outputs.tag }}"
          body: |
            PBRP Recovery for Samsung Galaxy S9 (starlte)
            Branch: ${{ env.MANIFEST_BRANCH }}
            Commit: ${{ github.sha }}
          files: ~/android/pbrp/out/target/product/${{ env.DEVICE }}/recovery.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
